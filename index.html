<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spesial Buat Kamu ❤️✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .heart-beat {
            animation: heartbeat 1.2s infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .float-heart {
            animation: floatUp 4s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-rose-100 via-pink-200 to-red-200 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Efek Hati Melayang di Background -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden z-0" id="heart-container"></div>

    <!-- Container Utama -->
    <div class="bg-white/80 backdrop-blur-md p-8 rounded-3xl shadow-2xl max-w-md w-full text-center relative z-10 border border-white">
        
        <!-- Icon Hati Berdetak -->
        <div class="flex justify-center mb-4">
            <span class="text-7xl heart-beat filter drop-shadow-md">💖</span>
        </div>

        <!-- Judul -->
        <h1 class="text-2xl font-bold text-rose-600 mb-2">Untuk Kamu yang Spesial ✨</h1>
        <p class="text-sm text-gray-600 mb-6">Sentuh tombol di bawah kalau penasaran isi hatiku...</p>

        <!-- Pesan Rahasia (Hidden by default) -->
        <div id="secret-message" class="hidden bg-rose-50 border border-rose-200 rounded-2xl p-4 mb-6 text-gray-700 text-sm leading-relaxed shadow-inner transition-all duration-500">
            "Makasih ya udah hadir dan bikin hari-hari jadi jauh lebih berwarna. Kamu itu rumah ternyaman buat aku. Tetap bareng aku terus ya? 🥺❤️"
        </div>

        <!-- Tombol Interaksi -->
        <div class="flex flex-col gap-3">
            <button onclick="revealLove()" id="love-btn" class="w-full py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-2xl shadow-lg transition transform active:scale-95">
                Buka Pesan Cinta 💌
            </button>
            <button onclick="playCuteEffect()" class="w-full py-3 bg-white hover:bg-rose-50 text-rose-500 font-semibold border-2 border-rose-300 rounded-2xl transition active:scale-95">
                Kirim Cinta Sejuta 🌸
            </button>
        </div>

    </div>

    <!-- Script Interaktif -->
    <script>
        function revealLove() {
            const msg = document.getElementById('secret-message');
            const btn = document.getElementById('love-btn');
            
            if(msg.classList.contains('hidden')) {
                msg.classList.remove('hidden');
                btn.innerText = "Sembunyikan Lagi 🙈";
                createFloatingHearts(15);
            } else {
                msg.classList.add('hidden');
                btn.innerText = "Buka Pesan Cinta 💌";
            }
        }

        function playCuteEffect() {
            createFloatingHearts(20);
            alert("Yeay! Cinta kamu sudah mendarat di hati aku 🥰💖");
        }

        // Fungsi membuat animasi hati melayang
        function createFloatingHearts(amount) {
            const container = document.getElementById('heart-container');
            const emojis = ['❤️', '💖', '💘', '✨', '🌸', '💌'];

            for (let i = 0; i < amount; i++) {
                const heart = document.createElement('div');
                heart.className = 'absolute float-heart text-2xl select-none';
                heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                
                // Posisi & durasi acak
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                heart.style.animationDelay = (Math.random() * 1) + 's';
                
                container.appendChild(heart);

                // Hapus elemen setelah animasi selesai
                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }
        }
    </script>
</body>
</html>
